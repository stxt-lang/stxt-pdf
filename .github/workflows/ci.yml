# Integración continua.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Tests
        run: mvn -B test
      # Los tests no deben modificar nada versionado: escriben en target/ y fallan
      # si cambia un PNG de referencia.
      - name: El árbol sigue limpio
        run: git status --porcelain --untracked-files=no | tee /dev/stderr | (! grep .)
      - name: Informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-jdk${{ matrix.java }}
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore
      # Si cambia una imagen de referencia, el PDF y las imágenes nuevas, para mirarlas.
      - name: Imágenes nuevas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: referencia-jdk${{ matrix.java }}
          path: target/reference
          if-no-files-found: ignore

  # El resultado no debe depender del idioma de la JVM: en turco tampoco cambia ningún PNG.
  locale:
    name: Tests con la JVM en turco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Tests
        run: mvn -B test -DargLine="-Duser.language=tr -Duser.country=TR"
      - name: El árbol sigue limpio
        run: git status --porcelain --untracked-files=no | tee /dev/stderr | (! grep .)
      - name: Imágenes nuevas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: referencia-turco
          path: target/reference
          if-no-files-found: ignore

  # Windows (separadores de ruta, fin de línea, ficheros abiertos que no se pueden borrar), a diario y a mano: es más
  # lento y no bloquea los cambios.
  windows:
    name: Tests en Windows
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      # Con el core.autocrlf del runner, como una copia de trabajo de Windows: los tests deben admitir CRLF.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Tests
        run: mvn -B test
      # Cada fichero cambiado, como anotación del job: se ve sin abrir el log.
      - name: El árbol sigue limpio
        shell: bash
        run: |
          changed=$(git status --porcelain --untracked-files=no)
          if [ -n "$changed" ]; then
            echo "$changed" | while IFS= read -r line; do echo "::error title=Fichero cambiado por los tests::$line"; done
            git diff --stat
            exit 1
          fi
      - name: Imágenes nuevas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: referencia-windows
          path: target/reference
          if-no-files-found: ignore

  # Medidas de rendimiento (@Tag("perf")), a diario y a mano; no bloquean los cambios.
  perf:
    name: Rendimiento
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test -Dgroups=perf -DexcludedGroups=none
