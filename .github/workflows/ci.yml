# Continuous integration.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Tests
        run: mvn -B test
      # The tests must not modify anything under version control: they write to target/ and fail
      # if a reference PNG changes.
      - name: The tree is still clean
        run: git status --porcelain --untracked-files=no | tee /dev/stderr | (! grep .)
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore
      # If a reference image changes, the PDF and the new images, to look at them.
      - name: New images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reference-jdk${{ matrix.java }}
          path: target/reference
          if-no-files-found: ignore

  # The result must not depend on the JVM language: in Turkish no PNG changes either.
  locale:
    name: Tests with the JVM in Turkish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Tests
        run: mvn -B test -DargLine="-Duser.language=tr -Duser.country=TR"
      - name: The tree is still clean
        run: git status --porcelain --untracked-files=no | tee /dev/stderr | (! grep .)
      - name: New images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reference-turkish
          path: target/reference
          if-no-files-found: ignore

  # Windows (path separators, line endings, open files that cannot be deleted), daily and on demand: it is slower
  # and does not block changes.
  windows:
    name: Tests on Windows
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      # With the runner's core.autocrlf, like a Windows working copy: the tests must accept CRLF.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Tests
        run: mvn -B test
      # Each changed file, as a job annotation: visible without opening the log.
      - name: The tree is still clean
        shell: bash
        run: |
          changed=$(git status --porcelain --untracked-files=no)
          if [ -n "$changed" ]; then
            echo "$changed" | while IFS= read -r line; do echo "::error title=File changed by the tests::$line"; done
            git diff --stat
            exit 1
          fi
      - name: New images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reference-windows
          path: target/reference
          if-no-files-found: ignore

  # Performance measurements (@Tag("perf")), daily and on demand; they do not block changes.
  perf:
    name: Performance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test -Dgroups=perf -DexcludedGroups=none
